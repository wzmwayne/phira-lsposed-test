plugins {
    id 'com.android.application'
}

android {
    namespace 'cn.test.phirauto'
    compileSdk 34
    // Preinstalled on GitHub ubuntu-latest runners — avoids a ~600MB NDK download per run.
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId "cn.test.phirauto"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "0.4.0"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    // Xposed API stubs for compilation only — must NOT end up in the APK,
    // otherwise they can shadow the real classes injected by LSPosed and the
    // module silently does nothing.
    compileOnly project(':stub')
}
