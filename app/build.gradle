plugins {
    id 'com.android.application'
}

android {
    namespace 'cn.test.phirauto'
    compileSdk 34
    // Preinstalled on GitHub ubuntu-latest runners — avoids a ~600MB NDK download per run.
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId "cn.test.phirauto"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
